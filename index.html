<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f5ef" />
  <title>제비뽑기</title>
  <link rel="stylesheet" href="/public/styles.css" />
</head>
<body>
  <main class="app-shell" id="appShell">
    <header class="topbar">
      <div class="connection-pill" id="connectionState" aria-live="polite">연결 중</div>
      <button class="icon-button" id="settingsBtn" type="button" aria-label="제비 설정 열기" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.25A3.75 3.75 0 1 0 12 15.75 3.75 3.75 0 0 0 12 8.25Zm9 3.75-2.15-.78a7.2 7.2 0 0 0-.62-1.5l.97-2.08-2.84-2.84-2.08.97a7.2 7.2 0 0 0-1.5-.62L12 3H8l-.78 2.15a7.2 7.2 0 0 0-1.5.62L3.64 4.8.8 7.64l.97 2.08a7.2 7.2 0 0 0-.62 1.5L-1 12l2.15.78c.15.52.36 1.03.62 1.5L.8 16.36l2.84 2.84 2.08-.97c.47.26.98.47 1.5.62L8 21h4l.78-2.15a7.2 7.2 0 0 0 1.5-.62l2.08.97 2.84-2.84-.97-2.08c.26-.47.47-.98.62-1.5L21 12Z" transform="translate(2 0) scale(.91)"/></svg>
      </button>
    </header>

    <section class="count-block" aria-live="polite">
      <p class="count-label">남은 제비</p>
      <p class="count-number" id="remainingCount">100</p>
    </section>

    <section class="draw-stage" id="drawStage" aria-live="polite">
      <div class="box-wrap" id="boxWrap">
        <div class="ticket hidden-ticket" id="ticket" aria-hidden="true"><span id="ticketText">?</span></div>
        <div class="lottery-box" aria-hidden="true">
          <div class="box-slot"></div>
          <div class="box-face-line"></div>
          <span class="box-label">제비</span>
        </div>
      </div>
    </section>

    <section class="result-panel" id="resultPanel" aria-live="polite"></section>

    <section class="primary-actions">
      <button class="primary-button" id="drawBtn" type="button" disabled>연결 중...</button>
      <button class="primary-button confirm-button" id="confirmBtn" type="button">확인</button>
    </section>

    <footer class="brand-footer" aria-label="브랜딩 로고">
      <img class="brand-logo brand-logo-enactus" src="/public/assets/enactus.png" alt="Enactus 로고" />
      <img class="brand-logo brand-logo-konkuk" src="/public/assets/konkuk-university.png" alt="건국대학교 로고" />
    </footer>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <div class="sheet-backdrop" id="sheetBackdrop" aria-hidden="true">
      <section class="settings-sheet" id="settingsSheet" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <div class="sheet-handle" aria-hidden="true"></div>
        <div class="sheet-heading">
          <div>
            <p class="sheet-kicker">설정</p>
            <h2 id="settingsTitle">제비 추가</h2>
          </div>
          <button class="text-button" id="closeSettingsBtn" type="button">닫기</button>
        </div>
        <p class="sheet-copy">기존에 남아 있는 제비와 새 제비만 다시 섞습니다.</p>

        <div class="step-row">
          <div>
            <strong>당첨 제비</strong>
            <span>추가할 개수</span>
          </div>
          <div class="stepper" aria-label="당첨 제비 추가 수량">
            <button type="button" id="winMinus" aria-label="당첨 제비 수량 줄이기">−</button>
            <output id="winAdd">0</output>
            <button type="button" id="winPlus" aria-label="당첨 제비 수량 늘리기">+</button>
          </div>
        </div>

        <div class="step-row">
          <div>
            <strong>꽝 제비</strong>
            <span>추가할 개수</span>
          </div>
          <div class="stepper" aria-label="꽝 제비 추가 수량">
            <button type="button" id="blankMinus" aria-label="꽝 제비 수량 줄이기">−</button>
            <output id="blankAdd">0</output>
            <button type="button" id="blankPlus" aria-label="꽝 제비 수량 늘리기">+</button>
          </div>
        </div>

        <div class="add-preview" id="addPreview">추가 후 남은 제비 100개</div>
        <button class="primary-button" id="addTicketsBtn" type="button">제비 추가하기</button>
      </section>
    </div>
  </main>
  <script type="module" src="/public/app.mjs"></script>
</body>
</html>
